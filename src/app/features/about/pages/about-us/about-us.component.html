<!-- ============================================================
     NOSOTROS PAGE
     ============================================================ -->

<!-- Hero Banner -->
<div class="about-hero">
  <picture>
    <source media="(max-width: 768px)" srcset="/images/about/banner-nosotros-mb.webp">
    <img src="/images/about/banner-nosotros-desk.webp" alt="Quiénes somos Paz Perú" class="about-hero__img">
  </picture>
  <div class="about-hero__overlay"></div>
</div>

<!-- Title Strip -->
<div class="about-title-strip">
  <h1 class="about-title-strip__text">Nosotros</h1>
  <div class="about-title-strip__line"></div>
</div>

<!-- Stats Section -->
<section class="about-stats">
  <div class="about-stats__bg" style="background-image: url('/images/about/bg-stats-nosotros.webp')"></div>
  <div class="about-stats__overlay"></div>

  <div class="about-stats__content">
    <div class="about-stats__grid">

      <ng-container *ngFor="let stat of stats; let i = index; let last = last">
        <div class="about-stats__item">
          <span class="about-stats__number">{{ stat.value }}</span>
          <span class="about-stats__label">{{ stat.label }}</span>
        </div>
        <div class="about-stats__divider" *ngIf="!last"></div>
      </ng-container>

    </div>

    <p class="about-stats__tagline">{{ tagline }}</p>
  </div>
</section>

<!-- Respaldo Section -->
<section class="about-respaldo">
  <div class="about-respaldo__container">
    <div class="about-respaldo__text">
      <h2 class="about-respaldo__title">{{ respaldoTitle }}</h2>
      <p *ngFor="let para of respaldoParas">{{ para }}</p>
    </div>
    <div class="about-respaldo__logos">
      <img src="/images/logos/logo-paz-nosotros.png" alt="Paz Corp" class="about-respaldo__logo">
    </div>
  </div>
</section>
