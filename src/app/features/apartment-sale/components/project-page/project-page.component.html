<ng-container *ngIf="config">
  <app-hero
    *ngIf="config.hero"
    [config]="config.hero">
  </app-hero>
  
  <!-- Banner promocional por proyecto (se oculta si isVisible=false o sin imagen) -->
  <app-promo-banner
    *ngIf="config.promoBanner"
    [config]="config.promoBanner">
  </app-promo-banner>

  <app-apartment-specs
    *ngIf="config.stats || config.specs"
    [stats]="config.stats"
    [specs]="config.specs">
  </app-apartment-specs>

  <app-amenities
    *ngIf="config.amenities"
    [config]="config.amenities">
  </app-amenities>

  <!-- Cotizador: se renderiza solo si el proyecto tiene iframeUrl configurado -->
  <app-quoter
    *ngIf="config.quoter"
    [config]="config.quoter">
  </app-quoter>

  <app-gallery
    *ngIf="config.gallery"
    [config]="config.gallery">
  </app-gallery>

  

  <app-virtual-tour
    *ngIf="config.virtualTour"
    [config]="config.virtualTour">
  </app-virtual-tour>

  <app-video
    *ngIf="config.video"
    [config]="config.video">
  </app-video>

  <app-ubication
    *ngIf="config.ubication"
    [config]="config.ubication">
  </app-ubication>

  <!-- Banner fijo inferior de ejecutivos de ventas -->
  <app-executive-banner
    *ngIf="activeExecutives.length > 0"
    [executives]="activeExecutives">
  </app-executive-banner>
</ng-container>
