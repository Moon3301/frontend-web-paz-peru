<section class="hero">
  <!-- Slides -->
  <div
    *ngFor="let slide of config.slides; let i = index"
    class="hero__slide"
    [class.hero__slide--active]="i === activeIndex"
    [style.backgroundImage]="'url(' + (slide.image | assetUrl) + ')'">
    <p class="hero__slide-label"> * Imagen referencial</p>
  </div>

  <!-- Overlay: logo image + textos superpuestos dentro de ella -->
  <div class="hero__overlay-panel">
    <div class="hero__logo-wrapper" *ngIf="config.logo" [ngStyle]="getLogoCssVars()">
      <img [src]="config.logo | assetUrl" [alt]="config.projectName" class="hero__logo">

      <!-- Bloque de texto posicionado DENTRO de la imagen del logo.
           Solo se renderiza si hay al menos un campo de texto definido,
           para evitar que el contenedor vacío muestre el fondo oscuro (móvil). -->
      <div class="hero__logo-text" [ngStyle]="getTextPositionStyle()"
           *ngIf="config.badge || config.description || config.priceLine1 || config.priceFrom">
        <span class="hero__badge"
              [ngStyle]="getElementStyle(badgeColor, config.badgeStyle)"
              *ngIf="config.badge">{{ config.badge }}</span>
        <p class="hero__description"
           [ngStyle]="getElementStyle(descriptionColor, config.descriptionStyle)"
           *ngIf="config.description">{{ config.description }}</p>
        <p class="hero__price-label"
           [ngStyle]="getElementStyle(priceLabelColor, config.priceLabelStyle)"
           *ngIf="config.priceLine1">{{ config.priceLine1 }}</p>
        <p class="hero__price-from"
           [ngStyle]="getElementStyle(priceFromColor, config.priceFromStyle)"
           *ngIf="config.priceFrom">{{ config.priceFrom }}</p>
      </div>
    </div>
  </div>

  <!-- Navegación (flechas) -->
  <button class="hero__nav hero__nav--prev" (click)="prev()" *ngIf="config.slides.length > 1" aria-label="Anterior">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </button>
  <button class="hero__nav hero__nav--next" (click)="next()" *ngIf="config.slides.length > 1" aria-label="Siguiente">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </button>

  <!-- Dots de paginación -->
  <div class="hero__pagination" *ngIf="config.slides.length > 1">
    <button
      *ngFor="let slide of config.slides; let i = index"
      class="hero__dot"
      [class.hero__dot--active]="i === activeIndex"
      (click)="goTo(i)"
      [attr.aria-label]="'Slide ' + (i + 1)">
    </button>
  </div>
</section>
