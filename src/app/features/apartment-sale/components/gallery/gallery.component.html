<section class="gallery" [style.background-color]="config.backgroundColor || null">
  <h2 class="gallery__title" [style.color]="config.textColor || null">
    {{ config.title || 'GALERIA' }}
  </h2>

  <!-- Tabs de categoría -->
  <div class="gallery__tabs">
    <button
      *ngFor="let tab of config.tabs; let i = index"
      class="gallery__tab-btn"
      [class.gallery__tab-btn--active]="i === activeTabIndex"
      [style.color]="i === activeTabIndex ? null : (config.textColor || null)"
      [style.border-color]="config.textColor || null"
      (click)="selectTab(i)">
      {{ tab.label }}
    </button>
  </div>

  <p class="gallery__subtitle" *ngIf="activeTab?.subtitle">{{ activeTab!.subtitle }}</p>

  <!-- Visor de imágenes del tab activo -->
  <div class="gallery__viewer" *ngIf="activeTab">

    <!-- Fondo difuminado con la misma imagen -->
    <div class="gallery__blur-bg"
         [style.background-image]="'url(' + (activeTab.images[activeImageIndex].src | assetUrl) + ')'">
    </div>

    <div class="gallery__img-wrap">
      <img
        [src]="activeTab.images[activeImageIndex].src | assetUrl"
        class="gallery__image"
        (error)="onImgError($event)">
    </div>

    <!-- Flechas -->
    <button class="gallery__nav gallery__nav--prev" (click)="prevImage()" *ngIf="activeTab.images.length > 1" aria-label="Anterior">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <button class="gallery__nav gallery__nav--next" (click)="nextImage()" *ngIf="activeTab.images.length > 1" aria-label="Siguiente">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <!-- Contador -->
    <div class="gallery__counter" *ngIf="activeTab.images.length > 1">
      {{ activeImageIndex + 1 }} / {{ activeTab.images.length }}
    </div>
  </div>
</section>
