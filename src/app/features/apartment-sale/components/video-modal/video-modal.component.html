<div class="video-modal__backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="video-modal__container">
    <button class="video-modal__close" (click)="close()" aria-label="Cerrar video">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="video-modal__iframe-wrapper" *ngIf="safeUrl">
      <iframe
        [src]="safeUrl"
        class="video-modal__iframe"
        frameborder="0"
        allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture">
      </iframe>
    </div>
  </div>
</div>
