<section class="paz-ubication" id="home-ubication">

  <!-- Section header -->
  <div class="paz-ubication__header">
    <h2 class="section-title paz-ubication__title">Ubícanos</h2>
    <p class="section-subtitle paz-ubication__subtitle">{{ subtitle }}</p>
  </div>

  <!-- Map image -->
  <div class="paz-ubication__map-container">
    <img
      [src]="mapImage"
      alt="Mapa de proyectos Paz Inmobiliaria en Lima"
      class="paz-ubication__map-img"
    />
  </div>

</section>
