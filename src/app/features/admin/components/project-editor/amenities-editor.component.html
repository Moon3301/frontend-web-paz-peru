<div class="sec-editor">
  <div class="sec-editor__header">
    <h3 class="sec-editor__title">Sección Amenidades</h3>
    <button class="adm-btn adm-btn--primary adm-btn--sm" (click)="save.emit()">Guardar sección</button>
  </div>
  <div class="adm-form-grid">
    <div class="adm-field">
      <label class="adm-label">Título</label>
      <input class="adm-input" [(ngModel)]="local.title" (ngModelChange)="emit()" placeholder="Áreas comunes">
    </div>
    <div class="adm-field">
      <label class="adm-label">Color de fondo</label>
      <div class="adm-color-row">
        <input type="color" class="adm-color-picker" [ngModel]="local.backgroundColor||'#8B6F57'" (ngModelChange)="local.backgroundColor=$event;emit()">
        <input class="adm-input" [(ngModel)]="local.backgroundColor" (ngModelChange)="emit()" placeholder="#8B6F57">
      </div>
    </div>
    <div class="adm-field">
      <label class="adm-label">Color texto</label>
      <div class="adm-color-row">
        <input type="color" class="adm-color-picker" [ngModel]="local.textColor||'#ffffff'" (ngModelChange)="local.textColor=$event;emit()">
        <input class="adm-input" [(ngModel)]="local.textColor" (ngModelChange)="emit()" placeholder="#ffffff">
      </div>
    </div>
  </div>
  <div class="sec-editor__subheader">
    <h4 class="sec-editor__subtitle">Íconos de amenidades</h4>
    <button class="adm-btn adm-btn--sm adm-btn--secondary" (click)="addItem()">+ Agregar</button>
  </div>
  <div class="adm-list">
    <div class="adm-list__item" *ngFor="let item of local.items; let i = index; trackBy: trackByIndex">
      <span class="adm-list__num">{{ i + 1 }}</span>
      <div class="adm-list__fields">
        <input class="adm-input" [(ngModel)]="item.icon" (ngModelChange)="emit()" placeholder="images/projects/xxx/icons/lobby.svg">
        <input class="adm-input" [(ngModel)]="item.label" (ngModelChange)="emit()" placeholder="LOBBY">
      </div>
      <button class="adm-btn-icon adm-btn-icon--danger" (click)="removeItem(i)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <p class="adm-empty-hint" *ngIf="!local.items?.length">Sin amenidades aún.</p>
</div>
