<div class="adm-root" [class.adm-root--collapsed]="!sidebarOpen">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="adm-sidebar" [class.adm-sidebar--open]="sidebarOpen">

    <!-- Logo / Brand -->
    <div class="adm-sidebar__brand">
      <img src="/images/logos/pazpe.png" alt="Paz" class="adm-sidebar__logo">
      <span class="adm-sidebar__brand-label">Admin</span>
      <button class="adm-sidebar__toggle" (click)="toggleSidebar()" aria-label="Colapsar menú">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <!-- Nav -->
    <nav class="adm-nav">

      <a routerLink="/admin" routerLinkActive="adm-nav__item--active"
         [routerLinkActiveOptions]="{exact:true}" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        <span class="adm-nav__label">Dashboard</span>
      </a>

      <div class="adm-nav__section-title">Contenido</div>

      <a routerLink="/admin/home" routerLinkActive="adm-nav__item--active" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="adm-nav__label">Home</span>
      </a>

      <a routerLink="/admin/projects" routerLinkActive="adm-nav__item--active" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="adm-nav__label">Proyectos</span>
      </a>

      <a routerLink="/admin/districts" routerLinkActive="adm-nav__item--active" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
        <span class="adm-nav__label">Distritos</span>
      </a>

      <a routerLink="/admin/delivered-projects" routerLinkActive="adm-nav__item--active" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span class="adm-nav__label">Entregados</span>
      </a>

      <a routerLink="/admin/promotions" routerLinkActive="adm-nav__item--active" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
        <span class="adm-nav__label">Promociones</span>
      </a>

      <a routerLink="/admin/blog" routerLinkActive="adm-nav__item--active" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span class="adm-nav__label">Blog</span>
      </a>

      <a routerLink="/admin/privacy-policy" routerLinkActive="adm-nav__item--active" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span class="adm-nav__label">Política Privacidad</span>
      </a>

      <div class="adm-nav__section-title">Desarrollo</div>

      <a routerLink="/admin/dev-tools" routerLinkActive="adm-nav__item--active" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        <span class="adm-nav__label">Dev Tools</span>
      </a>

      <div class="adm-nav__section-title">Recursos</div>

      <a routerLink="/admin/media" routerLinkActive="adm-nav__item--active" class="adm-nav__item">
        <svg class="adm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span class="adm-nav__label">Archivos</span>
      </a>

    </nav>

    <!-- Footer -->
    <div class="adm-sidebar__footer">
      <button class="adm-sidebar__logout" (click)="auth.logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="adm-nav__label">Cerrar sesión</span>
      </button>
    </div>

  </aside>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <div class="adm-main">

    <!-- Topbar -->
    <header class="adm-topbar">
      <button class="adm-topbar__menu" (click)="toggleSidebar()" aria-label="Abrir menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="adm-topbar__title">Paz Inmobiliaria</span>
      <div class="adm-topbar__spacer"></div>
      <div class="adm-topbar__user">
        <span class="adm-topbar__avatar">A</span>
        <span class="adm-topbar__username">Admin</span>
      </div>
    </header>

    <!-- Page content -->
    <main class="adm-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
