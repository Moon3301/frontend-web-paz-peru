<div class="dash">
  <div class="adm-page-header">
    <h1 class="adm-page-title">Dashboard</h1>
    <p class="adm-page-subtitle">Resumen del panel de control</p>
  </div>

  <div class="dash-stats">
    <div class="dash-stat">
      <div class="dash-stat__icon dash-stat__icon--gold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div class="dash-stat__info">
        <span class="dash-stat__value">{{ stats.projects }}</span>
        <span class="dash-stat__label">Proyectos activos</span>
      </div>
    </div>

    <div class="dash-stat">
      <div class="dash-stat__icon dash-stat__icon--green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <div class="dash-stat__info">
        <span class="dash-stat__value">{{ stats.delivered }}</span>
        <span class="dash-stat__label">Proyectos entregados</span>
      </div>
    </div>

    <div class="dash-stat">
      <div class="dash-stat__icon dash-stat__icon--purple">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
      </div>
      <div class="dash-stat__info">
        <span class="dash-stat__value">{{ stats.promotions }}</span>
        <span class="dash-stat__label">Promociones</span>
      </div>
    </div>
  </div>

  <div class="dash-shortcuts">
    <h2 class="adm-section-title">Accesos rápidos</h2>
    <div class="dash-shortcuts__grid">
      <a routerLink="/admin/projects/new" class="dash-shortcut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo proyecto
      </a>
      <a routerLink="/admin/promotions" class="dash-shortcut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        Gestionar promociones
      </a>
      <a routerLink="/admin/delivered-projects" class="dash-shortcut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        Proyectos entregados
      </a>
      <a routerLink="/admin/districts" class="dash-shortcut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Gestionar distritos
      </a>
    </div>
  </div>
</div>
