<div class="login-root">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <img src="/images/logos/pazpe.png" alt="Paz Inmobiliaria" class="login-logo__img">
      <span class="login-logo__label">Panel de Control</span>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form" autocomplete="off">

      <div class="login-field">
        <label class="login-label">Usuario</label>
        <input
          class="login-input"
          type="text"
          formControlName="username"
          placeholder="Ingresa tu usuario"
          autocomplete="username">
      </div>

      <div class="login-field">
        <label class="login-label">Contraseña</label>
        <div class="login-input-wrap">
          <input
            class="login-input"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password">
          <button type="button" class="login-toggle-pw" (click)="showPassword = !showPassword" tabindex="-1">
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="login-error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="login-btn" [disabled]="loading || form.invalid">
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading" class="login-spinner"></span>
      </button>

    </form>

  </div>
</div>
