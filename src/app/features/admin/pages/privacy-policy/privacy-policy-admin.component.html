<div class="adm-page">
  <div class="adm-page-header">
    <div>
      <h1 class="adm-page-title">Política de Privacidad</h1>
      <p class="adm-page-subtitle">Edita el contenido HTML que se muestra en la página pública</p>
    </div>
    <div class="adm-page-header__actions">
      <span class="adm-save-success" *ngIf="saved">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Guardado
      </span>
      <button class="adm-btn adm-btn--primary" (click)="save()" [disabled]="saving || loading">
        <span *ngIf="!saving">Guardar</span>
        <span *ngIf="saving" class="adm-spinner adm-spinner--sm"></span>
      </button>
    </div>
  </div>

  <div class="adm-loading" *ngIf="loading"><div class="adm-spinner"></div></div>

  <div class="adm-card" *ngIf="!loading">
    <p class="adm-hint" style="margin-bottom:12px">
      Puedes usar HTML para dar formato al contenido: <code>&lt;h2&gt;</code>, <code>&lt;p&gt;</code>, <code>&lt;ul&gt;</code>, <code>&lt;strong&gt;</code>, etc.
    </p>
    <div class="adm-field adm-field--full">
      <label class="adm-label">Contenido (HTML)</label>
      <textarea
        class="adm-input adm-textarea adm-textarea--tall"
        [(ngModel)]="content"
        placeholder="<h2>Política de Privacidad</h2><p>...</p>">
      </textarea>
    </div>

    <div class="pp-preview-section">
      <p class="adm-label" style="margin-bottom:8px">Vista previa</p>
      <div class="pp-preview-body" [innerHTML]="content"></div>
    </div>
  </div>
</div>
