<div class="adm-page">
  <div class="adm-page-header">
    <div>
      <h1 class="adm-page-title">Proyectos</h1>
      <p class="adm-page-subtitle">Gestiona todos los proyectos inmobiliarios</p>
    </div>
    <button class="adm-btn adm-btn--primary" (click)="newProject()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nuevo proyecto
    </button>
  </div>

  <!-- Loading -->
  <div class="adm-loading" *ngIf="loading">
    <div class="adm-spinner"></div>
  </div>

  <!-- Grid de proyectos -->
  <div class="proj-grid" *ngIf="!loading">
    <div class="proj-card" *ngFor="let p of projects">
      <div class="proj-card__thumb">
        <img [src]="p.thumbnailUrl ? ('http://localhost:3000/uploads/' + p.thumbnailUrl) : ''" [alt]="p.name"
             onerror="this.style.display='none'" class="proj-card__img">
        <div class="proj-card__thumb-placeholder" *ngIf="!p.thumbnailUrl">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <span class="badge {{ statusClass(p.status) }}">{{ p.status }}</span>
      </div>
      <div class="proj-card__body">
        <h3 class="proj-card__name">{{ p.name }}</h3>
        <p class="proj-card__district">{{ p.district }}</p>
      </div>
      <div class="proj-card__actions">
        <button class="adm-btn adm-btn--sm adm-btn--secondary" (click)="edit(p.id)">Editar</button>
        <button class="adm-btn adm-btn--sm"
                [class.adm-btn--secondary]="p.isActive"
                [class.adm-btn--warning]="!p.isActive"
                (click)="toggle(p)"
                [title]="p.isActive ? 'Desactivar de la web' : 'Activar en la web'">
          {{ p.isActive ? 'Activo' : 'Inactivo' }}
        </button>
        <button class="adm-btn adm-btn--sm adm-btn--danger" (click)="confirmDelete(p.id)">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="adm-empty" *ngIf="!loading && projects.length === 0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>
    <p>No hay proyectos aún</p>
    <button class="adm-btn adm-btn--primary" (click)="newProject()">Crear el primero</button>
  </div>
</div>

<!-- Confirm delete modal -->
<div class="adm-modal-backdrop" *ngIf="confirmDeleteId !== null" (click)="cancelDelete()">
  <div class="adm-modal" (click)="$event.stopPropagation()">
    <h3>¿Eliminar proyecto?</h3>
    <p>Esta acción desactivará el proyecto. ¿Deseas continuar?</p>
    <div class="adm-modal__actions">
      <button class="adm-btn adm-btn--secondary" (click)="cancelDelete()">Cancelar</button>
      <button class="adm-btn adm-btn--danger" (click)="doDelete(confirmDeleteId!)">Eliminar</button>
    </div>
  </div>
</div>
